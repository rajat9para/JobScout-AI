# Render Blueprint — JobScout v2
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Web Service (FastAPI + Twilio Webhooks) ──
  - type: web
    name: jobscout-v2-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: USER_WHATSAPP_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SCRAPE_INTERVAL_MINUTES
        value: "60"
    healthCheckPath: /health

  # ── Cron Job 1: Job Scraper (Hourly) ──
  - type: cron
    name: jobscout-v2-scraper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    schedule: "0 * * * *"  # Every hour at :00
    startCommand: python cron/scraper_job.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: USER_WHATSAPP_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

  # ── Cron Job 2: Exam Reminders (Daily at 8 AM) ──
  - type: cron
    name: jobscout-v2-reminders
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    schedule: "0 8 * * *"  # Daily at 8:00 AM
    startCommand: python cron/reminder_job.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        value: "whatsapp:+14155238886"
      - key: USER_WHATSAPP_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
